name: AI betting analysis
on:
  # GitHub runs schedules hours late on busy days, so the job does not rely
  # on them: it waits for the right minute itself (automatic mode) and starts
  # again on its own when the next match day is close. Any finished sync or
  # deploy also starts it, and so does this light schedule.
  schedule:
    - cron: "23 */3 * * *"
      timezone: "UTC"
  workflow_run:
    workflows: ["Synchronize football and standings", "Update live football scores", "Deploy frontend"]
    types: [completed]
  workflow_dispatch:
    inputs:
      modo:
        description: "automático: espera a la hora y lo hace · prueba: cuotas y datos sin IA ni guardar · completo: análisis del próximo día ya"
        type: choice
        options: [automatico, prueba, completo]
        default: automatico
permissions:
  contents: read
  # To start itself again while it waits for the next match day.
  actions: write
concurrency:
  # One automatic job at a time (it may be waiting); manual tests never queue behind it.
  group: betting-analysis-${{ github.event_name == 'workflow_dispatch' && inputs.modo != 'automatico' && 'manual' || 'auto' }}
  cancel-in-progress: false
jobs:
  analysis:
    runs-on: ubuntu-latest
    # Up to 5 h 15 min of waiting, then the analysis itself.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: analysis
        run: npm run analysis
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # The OddsPapi key (bet365 and Pinnacle prices).
          ODDSPAPI_KEY: ${{ secrets.BET365_ODDS_KEY || secrets.ODDSPAPI_KEY }}
          # Long-lived token of the owner's Claude plan (`claude setup-token`).
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          ANALYSIS_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'prueba' }}
          ANALYSIS_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.modo == 'completo' }}
          ANALYSIS_WAIT: ${{ github.event_name != 'workflow_dispatch' || inputs.modo == 'automatico' }}
      - name: Keep waiting for the next match day
        if: steps.analysis.outputs.chain == 'true'
        run: gh workflow run analysis.yml --ref "${{ github.ref_name }}" -f modo=automatico
        env:
          GH_TOKEN: ${{ github.token }}
