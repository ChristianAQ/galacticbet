name: Synchronize football and standings
on:
  push:
    branches: [master]
    paths:
      - "scripts/**"
      - "src/lib/roundDelivery.ts"
      - "src/lib/matchInsightsData.ts"
      - "src/lib/competitions.ts"
      - ".github/workflows/sync.yml"
  schedule:
    # Spain mainland time; timezone handles summer/winter automatically.
    # Keep 12 runs/day, moving the two evening slots to common match times.
    - cron: "17 1-19/2 * * *"
      timezone: "Europe/Madrid"
    - cron: "10 21 * * *"
      timezone: "Europe/Madrid"
    - cron: "0 23 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ESPN_NEWS: ${{ vars.ESPN_NEWS }}
          ESPN_MATCH_DETAILS: ${{ vars.ESPN_MATCH_DETAILS }}
