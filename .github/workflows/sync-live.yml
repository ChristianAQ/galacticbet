name: Update live football scores
on:
  schedule:
    - cron: "3-53/10 * * * *"
      timezone: "UTC"
  push:
    branches: [master]
    paths:
      - "scripts/sportApi*.ts"
      - "scripts/syncSportApi.ts"
      - "scripts/sync-live.ts"
      - "scripts/liveLoop.ts"
      - "src/lib/liveBoard.ts"
      - ".github/workflows/sync-live.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football-sync
  cancel-in-progress: false
jobs:
  live:
    runs-on: ubuntu-latest
    # The job stays alive while fixtures are in play (minute-by-minute checks)
    # and exits after one quick pass when there are none.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run sync:live
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SPORTAPI_KEY: ${{ secrets.SPORTAPI_KEY }}
          SPORTAPI_VERIFY: ${{ github.event_name != 'schedule' }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ESPN_NEWS: ${{ vars.ESPN_NEWS }}
          ESPN_MATCH_DETAILS: ${{ vars.ESPN_MATCH_DETAILS }}
          LIVE_LOOP_MINUTES: "25"
