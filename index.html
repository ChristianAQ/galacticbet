<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15140f" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Tu fútbol. Tus amigos. Tu quiniela. LaLiga, Champions y Premier en una sola liga privada."
    />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GalacticBet" />
    <!-- Content runs under the status bar; the ink masthead keeps its white text legible. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-1320x2868.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 420px) and (device-height: 912px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-1260x2736.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-1206x2622.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-1290x2796.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-1179x2556.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="%BASE_URL%splash/splash-1170x2532.png" />

    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="%BASE_URL%splash/splash-828x1792.png" />

    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Firebase hosts: open the connections while the app's code loads. -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <title>GalacticBet · El fútbol se juega entre amigos</title>
    <script>
      // Theme before the first paint (see src/lib/theme.ts): light unless the player chose dark.
      try {
        if (localStorage.getItem("galacticbet:theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
          document.querySelector('meta[name="theme-color"]').content = "#0a0907";
        }
      } catch (e) {}
    </script>
    <style>
      /* Ink until the app paints: no white flash between the launch screen and the app. */
      :where(html, body) {
        background: #15140f;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
